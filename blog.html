<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Article - Blogora</title>

<link rel="stylesheet" href="css/style.css">


</head>

<body>


<!-- =========================
     NAVBAR
========================== -->

<header class="navbar">

    <a href="index.html" class="logo">
        Blog<span>ora</span>
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#featured">
            Featured
        </a>

        <a href="index.html#latest">
            Latest
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>


    <div class="nav-actions">

        <button id="themeBtn" aria-label="Change theme">
            🌙
        </button>

    </div>

</header>


<!-- =========================
     ARTICLE
========================== -->

<main class="article-page">

    <div id="articleContainer">

        <!-- JavaScript loads article here -->

    </div>

</main>


<!-- =========================
     RELATED ARTICLES
========================== -->

<section class="related-section">

    <div class="section-heading">

        <div>

            <p class="small-heading">
                KEEP READING
            </p>

            <h2>
                Related Articles
            </h2>

        </div>

    </div>


    <div
        class="related-grid"
        id="relatedPosts">
    </div>

</section>


<!-- =========================
     FOOTER
========================== -->

<footer>

    <div class="footer-logo">
        Blog<span>ora</span>
    </div>

    <p>
        Stories, ideas and perspectives for curious minds.
    </p>


    <div class="footer-links">

        <a href="index.html">
            Home
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#featured">
            Featured
        </a>

        <a href="index.html#latest">
            Latest
        </a>

        <a href="index.html#about">
            About
        </a>

    </div>


    <p class="copyright">
        © 2026 Blogora. All rights reserved.
    </p>

</footer>


<!-- JavaScript -->

<script src="js/script.js"></script>


</body>

</html>
